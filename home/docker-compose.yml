# Anderson home Frigate stack (Windows PC / Docker Desktop).
# Run from this directory: docker compose up -d
# UI: http://localhost:5000  (unauthenticated local) or https://localhost:8971

services:
  mqtt:
    container_name: anderson-mqtt
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    command: mosquitto -c /mosquitto-no-auth.conf
    ports:
      - "1883:1883"
    volumes:
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log

  frigate:
    container_name: anderson-frigate
    image: ghcr.io/blakeblackshear/frigate:stable
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      - mqtt
    shm_size: "256mb"
    # privileged: true   # uncomment if USB Coral / some hwaccel needs it
    volumes:
      - ./config:/config
      - ./storage:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      - "5000:5000"     # Local unauthenticated UI (LAN only; prefer 8971 remotely)
      - "8971:8971"     # Authenticated UI / API
      - "8554:8554"     # go2rtc RTSP restream
      - "8555:8555/tcp" # WebRTC TCP
      - "8555:8555/udp" # WebRTC UDP
      - "1984:1984"     # go2rtc API / web UI
    environment:
      TZ: ${TZ:-America/Denver}
      # Optional: referenced in config as {FRIGATE_RTSP_PASSWORD} for camera RTSP auth
      FRIGATE_RTSP_PASSWORD: ${FRIGATE_RTSP_PASSWORD:-changeme}
      # Plus API (optional)
      PLUS_API_KEY: ${PLUS_API_KEY:-}

volumes:
  mqtt_data:
  mqtt_log:
