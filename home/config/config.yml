# Anderson family Frigate config — placeholders until real cameras arrive.
# Docs: https://docs.frigate.video/configuration/
# Remote access: ../REMOTE-ACCESS.md (Cloudflare Tunnel → port 8971)
# Replace PLACEHOLDER_* / CAMERA_IP values; do not invent camera IPs.

# JWT auth on port 8971 (reverse proxies / Cloudflare Tunnel must use 8971, never 5000).
auth:
  enabled: true

mqtt:
  enabled: true
  host: mqtt
  port: 1883

# Built-in go2rtc (restream / WebRTC). Streams stay empty until cameras exist.
# Remote live view goes through the authenticated UI (MSE). Keep 8555 on LAN only.
go2rtc:
  streams: {}
  webrtc:
    candidates:
      - stun:8555
  # Example when a camera is ready (uncomment and fill real RTSP):
  # streams:
  #   front_porch:
  #     - rtsp://viewer:{FRIGATE_RTSP_PASSWORD}@CAMERA_IP:554/Streaming/Channels/101
  #   front_porch_sub:
  #     - rtsp://viewer:{FRIGATE_RTSP_PASSWORD}@CAMERA_IP:554/Streaming/Channels/102

detectors:
  # CPU detector works without Coral/GPU. Swap for coral/openvino later if needed.
  cpu:
    type: cpu
    num_threads: 2

detect:
  enabled: false
  width: 1280
  height: 720
  fps: 5

record:
  enabled: false
  retain:
    days: 7
    mode: motion

snapshots:
  enabled: false
  retain:
    default: 14

cameras:
  # Disabled placeholders — Frigate starts, UI is reachable, no fake live streams.
  # Set enabled: true and real RTSP paths (or go2rtc restream URLs) when cameras arrive.
  front_porch:
    enabled: false
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:554/PLACEHOLDER_FRONT_PORCH
          roles:
            - detect

  driveway:
    enabled: false
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:554/PLACEHOLDER_DRIVEWAY
          roles:
            - detect

  backyard:
    enabled: false
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:554/PLACEHOLDER_BACKYARD
          roles:
            - detect

  garage:
    enabled: false
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:554/PLACEHOLDER_GARAGE
          roles:
            - detect

birdseye:
  enabled: false
  mode: objects
